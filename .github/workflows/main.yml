name: CI-CD
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
    CI:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
            - uses: actions/setup-python@v6
              with:
                python-version: '3.11'
            - name: Install Dependencies
              working-directory: 02-encontros-tech
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
            - name: Run Tests
              working-directory: 02-encontros-tech
              run: python -m pytest tests/ -v
            -
              name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            -
              name: Build and Push
              uses: docker/build-push-action@v6
              with:
                push: true
                tags: haryelramalho/bootcamp-encontros-tech:v${{ github.run_number }}
                file: ./02-encontros-tech/Dockerfile
                context: ./02-encontros-tech
    CD:
        runs-on: ubuntu-latest
        needs: [CI]
        steps:
            - run: echo "Obter o código"
            - run: echo "Configurar o Kubeconfig"
            - run: echo "Executar o apply"
